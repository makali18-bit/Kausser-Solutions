<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kausser Solutions | Sales Consultancy & Technical SME</title>
  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #071019;
      --bg-card: #0d1b2a;
      --navy-light: #15283c;
      --gold-primary: #d4af37;
      --gold-gradient: linear-gradient(135deg, #f3e5ab 0%, #cba153 50%, #9a7b38 100%);
      --gold-text: #e2c074;
      --text-light: #f0f4f8;
      --text-muted: #a0aec0;
      --border-color: rgba(203, 161, 83, 0.25);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Open Sans', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      line-height: 1.6;
      scroll-behavior: smooth;
    }

    h1, h2, h3, h4, .nav-logo text {
      font-family: 'Montserrat', sans-serif;
    }

    /* --- Navigation Bar --- */
    nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(7, 16, 25, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 5%;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    /* Scalable vector logo representation */
    .logo-mark {
      width: 44px;
      height: 44px;
      background: var(--gold-gradient);
      clip-path: polygon(0% 0%, 25% 0%, 25% 42%, 60% 0%, 100% 0%, 55% 50%, 100% 100%, 60% 100%, 35% 72%, 25% 82%, 25% 100%, 0% 100%);
    }

    .logo-text {
      display: flex;
      flex-direction: column;
    }

    .logo-text .brand-name {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--gold-text);
      line-height: 1.1;
    }

    .logo-text .brand-sub {
      font-size: 0.65rem;
      letter-spacing: 3px;
      color: #ffffff;
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 25px;
    }

    .nav-links a {
      color: var(--text-light);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    .nav-links a:hover {
      color: var(--gold-primary);
    }

    /* --- Hero Section --- */
    .hero {
      padding: 100px 5% 80px;
      text-align: center;
      background: radial-gradient(circle at center, rgba(21, 40, 60, 0.6) 0%, var(--bg-dark) 70%);
      border-bottom: 1px solid var(--border-color);
    }

    .hero-badge {
      display: inline-block;
      padding: 6px 16px;
      border: 1px solid var(--gold-primary);
      border-radius: 20px;
      color: var(--gold-text);
      font-size: 0.8rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 20px;
      background: rgba(212, 175, 55, 0.05);
    }

    .hero h1 {
      font-size: 2.8rem;
      font-weight: 700;
      color: #ffffff;
      max-width: 900px;
      margin: 0 auto 20px;
      line-height: 1.2;
    }

    .hero h1 span {
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      font-size: 1.15rem;
      color: var(--text-muted);
      max-width: 750px;
      margin: 0 auto 35px;
    }

    .btn-gold {
      display: inline-block;
      padding: 14px 32px;
      background: var(--gold-gradient);
      color: var(--bg-dark);
      font-weight: 700;
      text-decoration: none;
      border-radius: 4px;
      letter-spacing: 1px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-gold:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.3);
    }

    /* --- Section Containers --- */
    .section {
      padding: 80px 5%;
      max-width: 1200px;
      margin: 0 auto;
    }

    .section-title {
      text-align: center;
      margin-bottom: 50px;
    }

    .section-title h2 {
      font-size: 2rem;
      color: #ffffff;
      margin-bottom: 10px;
    }

    .section-title p {
      color: var(--gold-text);
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    /* --- Grid Layouts --- */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 30px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 25px;
    }

    /* --- Cards --- */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 30px;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: var(--gold-primary);
    }

    .card-icon {
      font-size: 2rem;
      color: var(--gold-primary);
      margin-bottom: 20px;
    }

    .card h3 {
      color: #ffffff;
      font-size: 1.3rem;
      margin-bottom: 15px;
    }

    .card p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .card ul {
      list-style: none;
      margin-top: 15px;
    }

    .card ul li {
      color: var(--text-light);
      margin-bottom: 10px;
      font-size: 0.9rem;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .card ul li i {
      color: var(--gold-primary);
      margin-top: 4px;
    }

    /* --- Regional Footprint Banner --- */
    .footprint-banner {
      background: var(--navy-light);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 40px;
      text-align: center;
      margin-top: 40px;
    }

    .footprint-banner h3 {
      color: var(--gold-text);
      font-size: 1.5rem;
      margin-bottom: 15px;
    }

    /* --- Contact Section --- */
    .contact-container {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 40px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
    }

    .contact-info h3 {
      color: #ffffff;
      font-size: 1.5rem;
      margin-bottom: 10px;
    }

    .contact-info .founder-title {
      color: var(--gold-text);
      font-weight: 600;
      margin-bottom: 25px;
    }

    .contact-details {
      list-style: none;
